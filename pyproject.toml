[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpks"
version = "0.1.6"
authors = [
    { name="Aaron Scott", email="aaron.scott@med.lu.se" },
    { name="Erik Hartman", email="erik.hartman@med.lu.se" },
    { name="Lars Malmström", email="lars.malmstrom@med.lu.se" },

]
description = "Data processing package for the analysis of omics data"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "anndata>=0.9.2",
    "biopython>=1.83",
    "gseapy>=1.1.13",
    "imbalanced-learn>=0.12.4",
    "jupyterlab>=4.3.8",
    "kneed>=0.8.6",
    "networkx>=3.1",
    "numba>=0.58.1",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "pytest>=8.3.5",
    "pytest-runner>=6.0.1",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.1",
    "streamlit>=1.40.1",
    "typer>=0.20.1",
    "umap-learn>=0.5.7",
    "unipressed>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/InfectionMedicineProteomics/DPKS"
Documentation = "https://infectionmedicineproteomics.github.io/DPKS/"
Issues = "https://github.com/InfectionMedicineProteomics/DPKS/issues"

[tool.hatch.build.targets.wheel]
packages = ["dpks"]

[project.scripts]
dpks = "dpks.cli.main:app"

[tool.pytest.ini_options]
# Move contents of pytest.ini here and delete that file
testpaths = ["tests"]

